services:
  redis:
    image: redis/redis-stack-server:7.2.0-v13
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentflow"]
      interval: 2s
      timeout: 2s
      retries: 15
