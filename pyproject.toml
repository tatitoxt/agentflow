[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agentflow"
version = "0.1.0"
description = "Lightweight, typed Python framework for tool-calling AI agents with vector memory and pluggable LLM providers."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Fausto Pastura" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.2,<1",
  "pydantic>=2.9.2,<3",
]

[project.optional-dependencies]
redis = ["redis>=5.0.8,<6"]
dev = [
  "mypy==1.13.0",
  "pip-audit==2.7.3",
  "pytest==9.0.3",
  "redis==5.0.8",
  "ruff==0.7.4",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "redis: requires a running Redis Stack (set AGENTFLOW_TEST_REDIS_URL)",
  "pgvector: requires Postgres + pgvector (set AGENTFLOW_TEST_PG_URL)",
  "e2e: drives the agentflow CLI as a subprocess",
]
addopts = "-ra"

[tool.uv]
# Pin runtime dependencies to mature, widely used releases in uv.lock.
constraint-dependencies = ["httpx==0.28.1", "pydantic==2.10.6", "redis==5.0.8", "psycopg[binary]==3.2.12"]

[dependency-groups]
dev = [
    "psycopg[binary]==3.2.12",
]
